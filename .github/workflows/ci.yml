name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'renovate/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          LINEAR_WEBHOOK_SECRET=test
          WEBHOOK_PORT=3000
          WORKSPACE_BASE_DIR=./tmp/workspaces
          PROMPT_TEMPLATE_PATH=./examples/prompt-template.txt
          ANTHROPIC_API_KEY=test
          MILEY_API_KEY=test
          EOF

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm -r test:run

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'edwardhallam/miley'
    runs-on: [self-hosted, macOS, ARM64, miley-deploy, mac-studio]
    concurrency:
      group: miley-production
      cancel-in-progress: false

    steps:
      - name: Deploy Miley on Mac Studio
        shell: bash
        run: |
          set -euo pipefail

          REPO="/Users/edwardhallam/code/miley"
          PLIST="/Users/edwardhallam/Library/LaunchAgents/com.miley.agent.plist"
          NODE="/opt/homebrew/opt/node@24/bin/node"

          test -x "$NODE"
          test -f "$PLIST"

          export PATH="/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

          cd "$REPO"
          git checkout main
          git diff --quiet
          git diff --cached --quiet
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            echo "Refusing to deploy with untracked files in $REPO"
            exit 1
          fi

          git fetch origin main
          git pull --ff-only origin main

          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm build

          launchctl bootout "gui/$(id -u)" "$PLIST" 2>/dev/null || true
          launchctl bootstrap "gui/$(id -u)" "$PLIST"

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3457/status; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:3457/status
          curl -fsS http://127.0.0.1:3457/version
          curl -fsS https://miley.spicyeddie.com/status
