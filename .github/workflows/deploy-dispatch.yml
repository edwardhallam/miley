name: Dispatch Private Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Miley deploy
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.repository == 'edwardhallam/miley'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private deploy
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.MILEY_DEPLOY_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          DISPATCHED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_DISPATCH_TOKEN}" ]; then
            echo "::error::Missing MILEY_DEPLOY_DISPATCH_TOKEN"
            exit 1
          fi

          payload=$(jq -n \
            --arg source_repo "${SOURCE_REPO}" \
            --arg source_branch "${SOURCE_BRANCH}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg source_run_id "${SOURCE_RUN_ID}" \
            --arg source_workflow "${SOURCE_WORKFLOW}" \
            --arg dispatched_at "${DISPATCHED_AT}" \
            '{
              event_type: "deploy",
              client_payload: {
                source_repo: $source_repo,
                source_branch: $source_branch,
                source_sha: $source_sha,
                source_run_id: $source_run_id,
                source_workflow: $source_workflow,
                dispatched_at: $dispatched_at
              }
            }')

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/edwardhallam/miley-deploy/dispatches \
            -d "${payload}"
